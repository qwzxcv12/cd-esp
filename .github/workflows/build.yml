name: Build ESP32 Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Reconstruct ESP-IDF Project Structure
        run: |
          mkdir -p project/main
          mkdir -p project/components

          cp ESP32C3_LEDRBG.cpp project/main/main.cpp || cp main.cpp project/main/main.cpp || true
          cp *.h project/main/ || true
          cp idf_component.yml project/main/ || true
          cp CMakeLists_main.txt project/main/CMakeLists.txt || true
          cp sdkconfig.defaults project/ || true

          printf 'cmake_minimum_required(VERSION 3.16)\ninclude($ENV{IDF_PATH}/tools/cmake/project.cmake)\nproject(ESP32C3_LEDRBG)\n' > project/CMakeLists.txt

          . $IDF_PATH/export.sh
          cd project
          idf.py set-target esp32c3
          idf.py build

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: |
            project/build/bootloader/bootloader.bin
            project/build/partition_table/partition-table.bin
            project/build/*.bin
